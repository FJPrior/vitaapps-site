<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6e6e73; --accent:#0a7d5a; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#f2f2f7; --muted:#98989d; --accent:#30d19a; --line:#2c2c2e; } }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.9rem; line-height:1.2; margin:0 0 16px; }
  h2 { font-size:1.25rem; margin:32px 0 8px; }
  a { color:var(--accent); }
  li { margin:6px 0; }
  footer { max-width:720px; margin:0 auto; padding:24px 16px 40px; border-top:1px solid var(--line);
           color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer>© {{ site.time | date: "%Y" }} Vita Apps · <a href="mailto:support@vitaapps.io">support@vitaapps.io</a></footer>
</body>
</html>
